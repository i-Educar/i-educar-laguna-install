    path: packages/buriti/i-educar-horario-automatico-package
  - git: git@github.com:i-Educar/i-educar-eventos-formacao-package.git
    path: packages/buriti/i-educar-eventos-formacao-package
  - git: git@github.com:i-Educar/i-educar-almoxarifado-escolar-package.git
