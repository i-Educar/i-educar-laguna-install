# Cópia operacional do manifesto Laguna (mantenha alinhado a i-educar-laguna-core)
core:
  repo: git@github.com:i-Educar/i-educar.git
  branch: "2.12"

# required_for_poc / onda 0-1 — clonados por padrão
modules_onda_0_1:
  - name: i-educar-exportacao-unificada-package
    git: git@github.com:i-Educar/i-educar-exportacao-unificada-package.git
    path: packages/buriti/i-educar-exportacao-unificada-package
  - name: i-educar-escolar-aderencia-package
    git: git@github.com:i-Educar/i-educar-escolar-aderencia-package.git
    path: packages/buriti/i-educar-escolar-aderencia-package
  - name: i-educar-transporte-escolar-v2
    git: git@github.com:i-Educar/i-educar-transporte-escolar-v2-package.git
    path: packages/buriti/i-educar-transporte-escolar-v2
  - name: pre-matricula-digital
    git: git@github.com:portabilis/pre-matricula-digital.git
    path: packages/portabilis/pre-matricula-digital
    note: Preferir fork Serventec/JaderGabriel se houver evoluções Laguna
  - name: i-educar-educacenso-import-package
    git: git@github.com:JaderGabriel/i-educar-educacenso-import-package.git
    path: packages/buriti/i-educar-educacenso-import-package

# onda 2+ — esqueletos (clone com --all)
modules_onda_2_plus:
